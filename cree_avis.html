
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
<link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet'>
<link rel="stylesheet" href="html/style.css"></head>
<body id="avis_client">
    
<header id="header_client">
    <div>
        <a href=../>
            <img src="SAE3_B21-SoftArmor/html/image/Alizon_blanc.png" alt="Logo Alizon" title="Logo Alizon">
        </a>

        <ul>
                            <li> <a href="SAE3_B21-SoftArmor/html/panier/"> <img src="SAE3_B21-SoftArmor/html/image/panier_blanc.svg" class="icon">Mon panier</a> </li>
                <li>
                    <div class="dropdown">
                        <button onclick="ouvrirMenu()" class="dropdown-button">
                            <img src="SAE3_B21-SoftArmor/html/image/compte_blanc.svg" class="icon">
                            didi                        </button>

                        <div id="dropdown-compte" class="dropdown-content">
                            <a href="SAE3_B21-SoftArmor/html/compte/informations"> <img src="SAE3_B21-SoftArmor/html/image/compte.svg" class="icon">Mon profil</a>

                            <a href="SAE3_B21-SoftArmor/html/deconnexion"> <img src="SAE3_B21-SoftArmor/html/image/deconnexion.svg" class="icon">Déconnexion</a>
                        </div>
                    </div>
                </li>
                    </ul>
    </div>
</header>

<script>
    function ouvrirMenu() {
        document.getElementById("dropdown-compte").classList.toggle("show");
    }

    // Ferme le menu si on clique ailleurs
    window.onclick = function(event) {
        if (!event.target.matches('.dropdown-button')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            var i;

            for (i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    }
</script>    <main>
        <section>
            <a href="../produit?id_produit=17">
                <article>
                    <h3>Clavier m&eacute;canique ArmorKey RGB</h3>
                    <img src="SAE3_B21-SoftArmor/html/ressources/produit/gl_jabba_gear.png" alt="Clavier m&eacute;canique ArmorKey RGB" title="Clavier m&eacute;canique ArmorKey RGB">
                </article>
            </a>
        </section>
        <section>
        <form action="" method="post" enctype="multipart/form-data">
            <input type="hidden" 
                value="17"
                name="produit"
                id="produit">

            <label for="note">Note : <output id="output">5</output></label>
            
            <input type="range" 
                name="note" 
                id="note"
                min="1"
                max="5"
                step="1"
                value="5"
                oninput="output.value = this.value"
                required
                class="champ">
            

            <label for="titre">Titre</label>
            <input type="text" 
                name="titre" 
                id="titre"
                class="champ">

            <label for="description">Description</label>
            <input type="text" 
                name="description" 
                id="description"
                class="champ text">

            <label for="image">Image</label>
            <input type="file" 
                name="image" 
                alt="image"
                accept=".png"
                value="test">

            <input type="submit" value="créer l'avis" class="bouton">
        </form>
        </section>
    </main>

</body>
</html>
