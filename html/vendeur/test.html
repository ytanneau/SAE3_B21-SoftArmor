
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
<link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet'>
<link rel="stylesheet" href="../style.css">
<link rel="icon" type="image/png" href="../image/logo_Alizon_bleu.png">    <title>Alizon Vendeur - Connexion</title>
</head>
<body id="connect_vendeur">
    <main>
        <img src="" alt="">
        <a href="./">
            <img src="../image/Alizon_vendeur_noir.png" alt="logo alizon" title="logo alizon">
        </a>
        <h2>S’identifier</h2>

        <form action="" method="post">
                <!-- Adresse e-mail -->
            <br>
            <label for="email">Email</label>
            <input type="email"
                name="email"
                id="email"
                value=""
                required
                class="champ">

                <!-- Mot de passe -->
            <label for="mdp">Mot de passe</label>
            <input type="password" 
                name="mdp"
                id="mdp"
                required
                class="champ">
            
            <input type="submit" value="Se connecter" class="bouton">        
        </form>
        <p>Pas de compte ? <a href="inscription/">S'inscrire</a></p>
    </main>
</body>
</html>
